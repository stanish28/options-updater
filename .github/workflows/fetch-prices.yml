name: fetch-prices

on:
  schedule:
    # 21:30 UTC = 5:30 PM EDT / 4:30 PM EST. After NYSE close + EOD processing.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: write  # needed to commit latest_prices.json back to the repo

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -q -r requirements.txt

      - name: Write service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service-account.json
          test -s service-account.json || { echo "service-account.json is empty"; exit 1; }

      - name: Fetch prices from Polygon
        env:
          SHEET_ID: 1Lo1QHqusZvrqNKfdZxgxauqNDXAe4OxuzCiEyYO8isQ
          CONFIG_TAB: Config
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ./service-account.json
        run: python fetch_prices.py

      - name: Commit latest_prices.json
        run: |
          rm -f service-account.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest_prices.json
          if git diff --cached --quiet; then
            echo "No changes to latest_prices.json"
          else
            git commit -m "chore: update latest_prices.json"
            git push
          fi
